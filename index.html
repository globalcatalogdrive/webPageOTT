    <script>
      const bannerImage = true;

      let globalDatabaseRows = [];

      function toggleThemeProfileMode() {
        const rootElement = document.documentElement;
        const currentTheme = rootElement.getAttribute("data-theme");
        if (currentTheme === "dark") {
          rootElement.setAttribute("data-theme", "light");
          localStorage.setItem("user-theme-choice", "light");
        } else {
          rootElement.setAttribute("data-theme", "dark");
          localStorage.setItem("user-theme-choice", "dark");
        }
      }

      function initializeSavedThemeSettings() {
        const savedPreference = localStorage.getItem("user-theme-choice");
        if (savedPreference) {
          document.documentElement.setAttribute("data-theme", savedPreference);
        } else if (
          window.matchMedia &&
          window.matchMedia("(prefers-color-scheme: dark)").matches
        ) {
          document.documentElement.setAttribute("data-theme", "dark");
        } else {
          document.documentElement.setAttribute("data-theme", "light");
        }
      }

      function handleBrokenImageFallback(element) {
        const imageCanvas = element.closest(".media-poster-canvas");
        if (imageCanvas) {
          imageCanvas.style.display = "none";
        }
      }

      function handleAvatarFallback(element) {
        element.src = `data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23888888"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>`;
      }

      function parseCsvToRows(csvText) {
        const lines = csvText.split(/\r?\n/);
        let outputRows = [];
        for (let i = 0; i < lines.length; i++) {
          let currentLine = lines[i].trim();
          if (currentLine === "") continue;

          let columns = [];
          let insideQuote = false;
          let currentColumnValue = "";

          for (let charIndex = 0; charIndex < currentLine.length; charIndex++) {
            let character = currentLine[charIndex];
            if (character === '"') {
              insideQuote = !insideQuote;
            } else if (character === "," && !insideQuote) {
              columns.push(currentColumnValue);
              currentColumnValue = "";
            } else {
              currentColumnValue += character;
            }
          }
          columns.push(currentColumnValue);
          outputRows.push(
            columns.map((col) => col.replace(/^"|"$/g, "").trim()),
          );
        }
        return outputRows;
      }



      function populatePlatformDropdown() {

  const platformSelector =
    document.getElementById("platformSelector");

  platformSelector.innerHTML =
    '<option value="">Platform</option>';

  const uniquePlatforms = [
    ...new Set(
      globalDatabaseRows.map(item => item.category)
    )
  ].sort();

  uniquePlatforms.forEach(platform => {

    const option = document.createElement("option");

    option.value = platform;
    option.textContent =
      platform.charAt(0).toUpperCase() +
      platform.slice(1);

    platformSelector.appendChild(option);
  });
}


      function loadCsvDataFiles() {
        document.getElementById("loadingStatus").style.display = "block";
        document.getElementById("verticalMediaStream").innerHTML = "";

        fetch("castName.csv")
          .then((response) => {
            if (!response.ok) {
              return "";
            }
            return response.text();
          })
          .then((castCsvText) => {
            if (castCsvText) {
              const castRows = parseCsvToRows(castCsvText);

              castRows.forEach((row) => {
                if (row.length >= 2 && row[0]) {
                  const nameKey = row[0].toLowerCase().trim();
                  if (
                    nameKey !== "" &&
                    nameKey !== "actress name" &&
                    nameKey !== "name"
                  ) {
                    const displayName = (row[0] || "").trim();
                    const normalizedName = displayName.toLowerCase();

                    if (
                      normalizedName &&
                      normalizedName !== "actress name" &&
                      normalizedName !== "name"
                    ) {
                      globalCastImagesMap[normalizedName] = {
                        displayName: displayName,
                        image: row[1] || "",
                      };
                    }
                  }
                }
              });
            }
            return fetch("database.csv");
          })
          .then((response) => {
            if (!response.ok) {
              throw new Error("Could not locate database.csv table asset.");
            }
            return response.text();
          })
          .then((databaseCsvText) => {
            const databaseRows = parseCsvToRows(databaseCsvText);
            let rawParsedRows = [];

            databaseRows.forEach((columns, index) => {
              if (index === 0 && columns[0].toLowerCase() === "category")
                return;

              if (columns.length >= 5) {
                const rowObject = {
                  category: columns[0].toLowerCase(),
                  webseriesName: columns[1],
                  actressName: columns[2]
                    .split(";")
                    .map((n) => n.trim())
                    .filter(Boolean),
                  pictureUrl: columns[3],
                  bannerImageUrl: columns[4],
                };
                rawParsedRows.push(rowObject);
              }
            });

            globalDatabaseRows = rawParsedRows.reverse();
            populatePlatformDropdown();
            document.getElementById("loadingStatus").style.display = "none";
            handleAppRouterState();
          })
          .catch((error) => {
            document.getElementById("loadingStatus").innerHTML =
              "Data Engine Connectivity Failure: " + error.message;
          });
      }
function normalizeText(str) {
  return (str || "")
    .toLowerCase()
    .replace(/\s+/g, " ")
    .trim();
}

function showSeriesPage(seriesName, category) {

  // 1. Switch UI view
  document.querySelectorAll(".app-page")
    .forEach(p => p.classList.remove("show-page"));

  const container = document.getElementById("seriesPage");
  container.classList.add("show-page");

  // 2. Decode + normalize incoming URL value
  const searchName = normalizeText(decodeURIComponent(seriesName));

  // 3. Find exact match first
  let item = globalDatabaseRows.find(
    s => normalizeText(s.webseriesName) === searchName
  );

  // 4. Fallback: partial match (extra safety)
  if (!item) {
    item = globalDatabaseRows.find(
      s => normalizeText(s.webseriesName).includes(searchName)
    );
  }

  // 5. If still not found
  if (!item) {
    container.innerHTML = `
      <div style="padding:20px;text-align:center;color:#888">
        Series not found<br><br>
        <a href="#${category}">⬅ Go Back</a>
      </div>
    `;
    return;
  }

  // 6. Build cast HTML safely
  const castHtml = (item.actressName || [])
    .map(name => `<span style="margin-right:6px;">${name}</span>`)
    .join(", ");

  // 7. Render series page
  container.innerHTML = `
    <div style="padding:15px;">

      <h2 style="margin-bottom:10px;">
        ${item.webseriesName}
      </h2>

      ${item.pictureUrl ? `
        <img src="${item.pictureUrl}"
             style="max-width:220px;border-radius:12px;margin-bottom:10px;"
             onerror="this.style.display='none'">
      ` : ""}

      <p><b>Category:</b> ${item.category.toUpperCase()}</p>

      <p><b>Cast:</b> ${castHtml || "N/A"}</p>

      ${item.bannerImageUrl ? `
        <div style="margin-top:10px;">
          <img src="${item.bannerImageUrl}"
               style="max-width:100%;border-radius:10px;"
               onerror="this.style.display='none'">
        </div>
      ` : ""}

      <div style="margin-top:15px;">
        <a href="#${category}" style="text-decoration:none;">
          ⬅ Back to Catalog
        </a>
      </div>

    </div>
  `;
}

      function handleAppRouterState() {
        const hashLocation = window.location.hash || "#home";
const [route, queryString] =
  hashLocation.split("?");

const params =
  new URLSearchParams(queryString || "");

const selectedSeries =
  params.get("series")? decodeURIComponent(params.get("series")) : null;

if (selectedSeries) {
  showSeriesPage(selectedSeries, targetCategory);
  return;
}

  
        document
          .querySelectorAll(".app-page")
          .forEach((page) => page.classList.remove("show-page"));
        document
          .querySelectorAll(".tab-button")
          .forEach((btn) => btn.classList.remove("active"));

          renderGlobalTextCastList();
        } else {
          const hashParts = hashLocation.replace("#", "").split("?cast=");

          const targetCategory = hashParts[0].toLowerCase();

          currentFilterSelection =
            hashParts.length > 1 ? decodeURIComponent(hashParts[1]) : null;

          currentActiveCategory = targetCategory;

          const tabElement = document.getElementById(targetCategory + "Tab");

          if (tabElement) {
            tabElement.classList.add("active");
          }

 if (currentFilterSelection) {

  document.getElementById("catalogPageTitle").textContent =
    currentFilterSelection + " - All Platforms";

} else {

  document.getElementById("catalogPageTitle").textContent =
    targetCategory.charAt(0).toUpperCase() +
    targetCategory.slice(1) +
    " Catalog";

}

          document.getElementById("clearFilterBtnX").href =
            "#" + currentActiveCategory;

          document
            .getElementById("catalogDisplayPage")
            .classList.add("show-page");

          const badgeBox = document.getElementById(
            "activeFilterNotificationBadge",
          );

          const filterLabelString = document.getElementById(
            "activeFilterNameString",
          );

          const filterAvatarImg = document.getElementById(
            "activeFilterAvatarImg",
          );

          const filterRectangularImg = document.getElementById(
            "activeFilterRectangularImg",
          );

          const posterCardHolder = document.getElementById(
            "integratedProfilePosterCard",
          );

          if (currentFilterSelection) {
            filterLabelString.textContent = currentFilterSelection;

            const imageLookupKey = currentFilterSelection.toLowerCase().trim();

            const avatarSrcUrl =
              globalCastImagesMap[imageLookupKey]?.image || "";

            filterAvatarImg.src = avatarSrcUrl;

            if (avatarSrcUrl) {
              filterRectangularImg.src = avatarSrcUrl;
              posterCardHolder.style.display = "block";
            } else {
              posterCardHolder.style.display = "none";
            }

            badgeBox.style.display = "none";
          } else {
            badgeBox.style.display = "none";
            posterCardHolder.style.display = "none";
          }

          makeStreamCards();
        }
      }

      function makeStreamCards() {
        const streamBox = document.getElementById("verticalMediaStream");
        streamBox.innerHTML = "";

        if (currentFilterSelection) {
          let platformsDataMap = {};

          for (let i = 0; i < globalDatabaseRows.length; i++) {
            const item = globalDatabaseRows[i];

            const castList = item.actressName || [];

            const filter = (currentFilterSelection || "").toLowerCase();

            if (castList.some((cast) => cast.toLowerCase() === filter)) {
              let sourceKey = item.category.toUpperCase();
              if (!platformsDataMap[sourceKey]) {
                platformsDataMap[sourceKey] = [];
              }
              platformsDataMap[sourceKey].push(item);
            }
          }

          let sourcePlatformsArray = Object.keys(platformsDataMap);

          if (sourcePlatformsArray.length === 0) {
            streamBox.innerHTML = `<div style="text-align:center; padding:20px; color:#888; font-size:0.9rem;">No series found for this profile.</div>`;
            return;
          }

          sourcePlatformsArray.forEach((platformName, index) => {
            const sourceHeader = document.createElement("div");
            sourceHeader.className =
              "source-category-section-divider" +
              (index > 0 ? " extra-margin" : "");
            sourceHeader.textContent = platformName;
            streamBox.appendChild(sourceHeader);

            platformsDataMap[platformName].forEach((item) => {
              streamBox.appendChild(createSeriesCardNode(item));
            });
          });
        } else {
          let itemsFoundCount = 0;
          for (let i = 0; i < globalDatabaseRows.length; i++) {
            const item = globalDatabaseRows[i];
            if (item.category !== currentActiveCategory) continue;

            itemsFoundCount++;
            streamBox.appendChild(createSeriesCardNode(item));
          }

          if (itemsFoundCount === 0) {
            streamBox.innerHTML = `<div style="text-align:center; padding:20px; color:#888; font-size:0.9rem;">No titles loaded in this category.</div>`;
          }
        }
      }

      function createSeriesCardNode(item) {
        let castList = item.actressName || [];
        const itemBlock = document.createElement("div");
        itemBlock.className = "webseries-item-entry";

        let castHtmlString = "Cast: ";
        if (castList.length === 0) {
          castHtmlString += "<span>Information Pending</span>";
        } else {
          castList.forEach((name, idx) => {
            castHtmlString += `<a class="cast-clickable-span" href="#${item.category}?cast=${encodeURIComponent(name)}">${name}</a>`;
            if (idx < castList.length - 1) {
              castHtmlString += ", ";
            }
          });
        }

        let platformBadgeHTML = "";
        if (
          bannerImage === true &&
          item.bannerImageUrl &&
          item.bannerImageUrl.trim() !== ""
        ) {
          platformBadgeHTML = `
                <a href="${item.bannerImageUrl}" target="_blank" class="badge-link-wrapper">
                    <img src="${item.bannerImageUrl}" class="corner-overlay-brand-badge" alt="${item.webseriesName || "Webseries"} Official Banner" onerror="this.style.display='none'">
                </a>`;
        }

        let posterImageBlockHTML = "";
        if (item.pictureUrl && item.pictureUrl.trim() !== "") {
          posterImageBlockHTML = `
                <div class="media-poster-canvas">
                    <a href="${item.pictureUrl}" target="_blank" class="poster-link-wrapper">
                        <img src="${item.pictureUrl}" class="display-photo" alt="${item.actressName || "Cast"} Photo Profile Wallpaper from ${item.webseriesName || "Production"}" loading="lazy" onerror="handleBrokenImageFallback(this)">
                    </a>
                    ${platformBadgeHTML}
                </div>`;
        }

        itemBlock.innerHTML = `
            <div class="card-metadata-row">
                <div class="series-text-header">${item.webseriesName || "Untitled Production"}</div>
                <div class="cast-link-subheader">
                    ${castHtmlString}
                </div>
            </div>
            ${posterImageBlockHTML}
            <hr class="separator-line">
        `;
        return itemBlock;
      }

function handleCastCardFallback(img) {
  img.onerror = null;
  img.src = "assets/default-avatar.png";
  img.alt = "No Image Available";
  img.classList.add("is-fallback");

}
      function renderGlobalTextCastList() {
        const targetOutputBox = document.getElementById(
          "verticalCastOutputBox",
        );
        const alphabetBar = document.getElementById("alphabetFilterBar");

        targetOutputBox.innerHTML = "";
        alphabetBar.innerHTML = "";

        console.log("alphabetBar =", alphabetBar);

        // 1. Collect unique names
        let uniqueNamesMap = new Map();

        globalDatabaseRows.forEach((item) => {
          (item.actressName || []).forEach((name) => {
            if (name) uniqueNamesMap.set(name.toLowerCase(), name);
          });
        });

        let uniqueNames = [...uniqueNamesMap.values()].sort((a, b) =>
          a.localeCompare(b),
        );

        // 2. Build alphabet index
        let grouped = {};
        uniqueNames.forEach((name) => {
          let letter = name.charAt(0).toUpperCase();
          if (!grouped[letter]) grouped[letter] = [];
          grouped[letter].push(name);
        });

        // 3. Build filter buttons
        const letters = ["ALL", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("")];

        letters.forEach((letter) => {
          const btn = document.createElement("button");
          btn.className = "alphabet-filter-btn";
          btn.textContent = letter;

          btn.onclick = () => {
            document
              .querySelectorAll(".alphabet-filter-btn")
              .forEach((b) => b.classList.remove("active"));

            btn.classList.add("active");

            alphabetBar.scrollTo({
              left: btn.offsetLeft - 40,
              behavior: "smooth",
            });
            renderCastByLetter(letter, grouped, targetOutputBox);
          };

          alphabetBar.appendChild(btn);
        });

        // default load ALL
        const firstBtn = alphabetBar.querySelector("button");
        if (firstBtn) firstBtn.classList.add("active");
        renderCastByLetter("ALL", grouped, targetOutputBox);
      }

      function renderCastByLetter(letter, grouped, container) {
        container.innerHTML = "";

        let namesToShow = [];

        if (letter === "ALL") {
          Object.values(grouped).forEach((arr) => {
            namesToShow.push(...arr);
          });
        } else {
          namesToShow = grouped[letter] || [];
        }

        namesToShow
          .sort((a, b) => a.localeCompare(b))
          .forEach((name) => {
            const row = document.createElement("a");
            row.className = "cast-card";

            const runtimeAvatarSrc =
              globalCastImagesMap[name.toLowerCase()]?.image || "";

            row.href = `#${currentActiveCategory}?cast=${encodeURIComponent(name)}`;

            row.innerHTML = `
                <img class="cast-card-image"
                     src="${runtimeAvatarSrc}"
                     alt="${name}"
                     loading="lazy"
                     onerror="handleCastCardFallback(this)">

                <div class="cast-card-name">${name}</div>
            `;

            container.appendChild(row);
          });

        if (namesToShow.length === 0) {
          container.innerHTML = `<div style="padding:10px;color:#888">No actresses found</div>`;
        }
      }

function initializeGlobalSearch() {

  const searchInput =
    document.getElementById("globalSearchInput");

  const suggestionBox =
    document.getElementById("searchSuggestions");

  searchInput.addEventListener("input", function() {

    const query =
      this.value.trim().toLowerCase();

    if(query.length < 2){
      suggestionBox.style.display = "none";
      return;
    }

    let results = [];

    // Actress search
    Object.values(globalCastImagesMap).forEach(cast => {

      if(
        cast.displayName
          .toLowerCase()
          .includes(query)
      ){

        results.push({
          type:"cast",
          label:cast.displayName
        });
      }
    });

    // Series search
    globalDatabaseRows.forEach(item => {

      if(
        item.webseriesName
          .toLowerCase()
          .includes(query)
      ){

        results.push({
          type:"series",
          label:item.webseriesName,
          category:item.category
        });
      }
    });

    results = results.slice(0,15);

    if(results.length===0){
      suggestionBox.style.display="none";
      return;
    }

    suggestionBox.innerHTML = "";

    results.forEach(result => {

      const row =
        document.createElement("div");

      row.className = "search-item";

      if(result.type==="cast"){

        row.innerHTML = `
          <div>${result.label}</div>
          <div class="search-type">
            Actress
          </div>
        `;

        row.onclick = () => {

          window.location.hash =
            "#" +
            currentActiveCategory +
            "?cast=" +
            encodeURIComponent(result.label);

          suggestionBox.style.display = "none";
          searchInput.value = "";
        };

      }else{

        row.innerHTML = `
          <div>${result.label}</div>
          <div class="search-type">
            ${result.category.toUpperCase()}
          </div>
        `;

row.onclick = () => {
  window.location.hash =
    "#" +
    result.category +
    "?series=" +
    encodeURIComponent(result.label);

  searchInput.value = result.label;
  suggestionBox.style.display = "none";
};
      }

      suggestionBox.appendChild(row);

    });

    suggestionBox.style.display = "block";

  });

  document.addEventListener("click", function(e){

    if(
      !searchInput.contains(e.target) &&
      !suggestionBox.contains(e.target)
    ){
      suggestionBox.style.display = "none";
    }

  });

}
